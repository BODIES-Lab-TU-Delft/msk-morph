# Define landmark order for each mesh csv file
csv_mesh_files_order:
  pelvis_r:
    - rASIS_in_pelvis_physicalbodyoffset
    - rPSIS_in_pelvis_physicalbodyoffset
  pelvis_l:
    - lASIS_in_pelvis_physicalbodyoffset 
    - lPSIS_in_pelvis_physicalbodyoffset
  femur_r:
    - hip_r_joint_in_r_femur
    - rFLE_in_femur_r_physicalbodyoffset
    - rFME_in_femur_r_physicalbodyoffset
  femur_l:
    - hip_l_joint_in_l_femur
    - lFLE_in_femur_l_physicalbodyoffset
    - lFME_in_femur_l_physicalbodyoffset
  sacrum: [] # No landmarks for sacrum in mesh files
  patella_r: [] # No landmarks for patella in mesh files
  patella_l: [] # No landmarks for patella in mesh files

# Define landmark order for each stations csv file
csv_stations_files_order:
  pelvis:
    - rASIS_in_pelvis_physicalbodyoffset
    - rPSIS_in_pelvis_physicalbodyoffset
    - lASIS_in_pelvis_physicalbodyoffset
    - lPSIS_in_pelvis_physicalbodyoffset
    - hip_r_joint_in_pelvis
    - hip_l_joint_in_pelvis
    - midASIS_in_pelvis_physicalbodyoffset
    - midPSIS_in_pelvis_physicalbodyoffset
  femur_r:
    - hip_r_joint_in_r_femur
    - rFLE_in_femur_r_physicalbodyoffset
    - rFME_in_femur_r_physicalbodyoffset
    - mid_rFE_in_femur_r_physicalbodyoffset
  femur_l:
    - hip_l_joint_in_l_femur
    - lFLE_in_femur_l_physicalbodyoffset
    - lFME_in_femur_l_physicalbodyoffset
    - mid_lFE_in_femur_l_physicalbodyoffset

# Define landmark order for osim marker files
marker_order:
  - rASIS
  - lASIS
  - midASIS
  - rPSIS
  - lPSIS
  - midPSIS
  - mid_midASISmidPSIS
  - rHJC
  - rFLE
  - rFME
  - midrFE
  - lHJC
  - lFLE
  - lFME
  - midlFE
  - midHJC

