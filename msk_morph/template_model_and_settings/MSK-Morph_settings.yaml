
# Settings file part of the MSK-Morph framework
# Code's author: Judit Cueto Fernandez

# Define mesh and stations csv files to be automatically generated
csv_file_names: 
  - mesh: # the complete file name generated by MSK-Morph will be: meshname_mesh_target_landmarks.csv. Contain all landmarks in a bone mesh
    - pelvis_r
    - pelvis_l
    - sacrum
    - femur_r
    - femur_l
    - patella_r
    - patella_l
  - stations: # the complete file name generated by MSK-Morph will be: meshname_stations_target_landmarks.csv. Contain relevant anatomical landmarks for the LD-MSK model structure in a bone mesh
    - pelvis
    - femur_r
    - femur_l

landmarks:
