    measured: true
    measurement:
      mesh: pelvis_r
      location: [0.0, 0.9400000000000001, 0.12083300018310547]
    in_csv_files: true
    csv_files:
      mesh_files: [pelvis_r]
      stations_files: [pelvis]
    in_marker_file: true
    details_marker:
      marker_name: rASIS
      osim_body_frame: /bodyset/pelvis/pelvis_physicalbodyoffset

